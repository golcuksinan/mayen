[project]
name = "mayen"
version = "0.1.0"
description = "Yerel çalışan, cihazlara yayılmış asistan (docs/ARCHITECTURE.md)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pipecat-ai==1.12.0",  # sabit: güncelleme bilinçli bir karardır
    "pydantic>=2.11",  # tool argümanları (§9.1); pipecat de ona bağlı
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mayen"]

[tool.ruff]
src = ["src", "tests"]
line-length = 96
target-version = "py313"
# Deneyler kendi pyproject'leriyle ayrı projelerdir.
extend-exclude = ["deney"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]
# Proje dili Türkçe; "ı/ş/ğ belirsiz karakter" uyarıları burada gürültüden ibaret.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

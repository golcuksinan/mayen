[project]
name = "mayen"
version = "0.1.0"
description = "Türkçe konuşan, İngilizce yanıtlayan yerel sesli asistan"
requires-python = ">=3.13,<3.14"
dependencies = [
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mayen"]

[tool.ruff]
src = ["src", "tests"]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]
# Proje dili Türkçe; "ı/ş/ğ belirsiz karakter" uyarıları burada gürültüden ibaret.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Sistemin tamamı asyncio; her async testi ayrı ayrı işaretlemek gürültüden ibaret.
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

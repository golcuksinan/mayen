[project]
name = "mayen"
version = "0.1.0"
description = "Yerel çalışan, cihazlara yayılmış asistan (docs/ARCHITECTURE.md)"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=3.29",  # llama.cpp adaptörü OpenAI uyumlu ucu kullanır
    "pipecat-ai[websocket]==1.12.0",  # sabit; `websocket`: çok istemcili taşıma (§13)
    "pydantic>=2.11",  # tool argümanları (§9.1); pipecat de ona bağlı
    "pywebview[pyside6]>=6.2.1",
    "pyyaml>=6.0.3",  # config (§14)
    "sounddevice>=0.5",  # mikrofon istemcisi (clients/); sistemde PortAudio ister
    "uvicorn>=0.30",  # kanalların sunucusu (§7, §13)
    "websockets>=14",  # istemciler (clients/) ve VAD servisinin akışı
]

[project.scripts]
mayen = "mayen.app.main:main"
mayen-terminal = "mayen.clients.terminal:main"
mayen-mic = "mayen.clients.mic:main"
mayen-desktop = "mayen.clients.screen:main"
mayen-turns = "mayen.clients.turns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mayen"]

[tool.ruff]
src = ["src", "tests"]
line-length = 96
target-version = "py313"
# Deneyler kendi pyproject'leriyle ayrı projelerdir.
extend-exclude = ["deney"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]
# Proje dili Türkçe; "ı/ş/ğ belirsiz karakter" uyarıları burada gürültüden ibaret.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12.20260906",
]

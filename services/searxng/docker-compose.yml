# SearXNG — arama sağlayıcısı, kendi sürecinde (`services/` dizininin anlamı bu).
#
# Neden yerel bir örnek: anahtar yok, kota yok, sorgu üçüncü tarafa gitmiyor. Sistem
# kendi verisine sahip olur (§1); bir arama API'sine sorgu göndermek, kullanıcının ne
# sorduğunu dışarıya vermek olurdu.
#
# Kokoro gibi bu da bir servis ama `baslat` onu açmıyor: GPU tutmuyor, elle
# değiştirilmiyor, ve kapalıyken tek sonucu `web_search`'ün hata döndürmesi (§8.2: tool
# hatası modele geri beslenir). Yeri sürekli ayakta duran bir konteyner —
# `restart: unless-stopped`.
#
# Kurulum:
#   cp .env.example .env && sed -i "s/DEGISTIR/$(openssl rand -hex 32)/" .env
#   docker compose up -d
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: mayen-searxng
    restart: unless-stopped
    ports:
      # `127.0.0.1`'e sabitli, `8082:8080` değil. Adres yazılmazsa docker her arayüze
      # bağlar ve servis ağa açılır; `ARCHITECTURE.md:24` uzaktan erişimi kapsam dışı
      # sayıyor. 8082 çünkü 8080 `llama-server`, 8081 Kokoro, 8765 `mayen`.
      - "127.0.0.1:8082:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8082/
      # Eksikse konteyner **açılmıyor**: `?` ile compose hata verir. Varsayılan bir
      # sır üretmek, herkesin bildiği bir sırla koşmak olurdu (Kural 13).
      - SEARXNG_SECRET=${SEARXNG_SECRET:?services/searxng/.env yok ya da SEARXNG_SECRET boş}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

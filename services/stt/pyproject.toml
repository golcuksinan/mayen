# Mayen'in STT servisi; çekirdeğin ortamından ayrı bir proje. CTranslate2 ve CUDA kütüphaneleri
# birkaç gigabayt ve çekirdeğin kapılarının hiçbiri onlara bakmıyor. Çalıştırma:
#
#     uv run --project services/stt python services/stt/main.py <config.yaml>
[project]
name = "mayen-stt"
version = "0.1.0"
description = "Mayen'in STT servisi: Whisper, kendi sürecinde"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper==1.2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=14",  # uvicorn'un WebSocket ucu (/vad)
    "numpy>=2",
    "pyyaml>=6.0.3",
    # Sözün bitişini bulan model (Smart Turn) ve girdisini hazırlayan kod; çekirdekteki
    # Pipecat sürümüyle aynı, çekirdek modeli kendisi yüklemesin diye burada (§18).
    "pipecat-ai==1.12.0",
    # Wake word modeli ve girdisini hazırlayan kod (ses özelliği + gömme modelleri); §6.
    "openwakeword==0.6.0",
    "nvidia-cublas-cu12>=12.9",  # CTranslate2 CUDA 12 ister; sistemde olmayabilir
    "nvidia-cudnn-cu12>=9",
]

[tool.uv]
# openwakeword'ün Linux'ta istediği tflite-runtime yalnız tflite modeli içindir; model .onnx.
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]
environments = ["sys_platform == 'linux'"]

# Mayen'in STT servisi; çekirdeğin ortamından ayrı bir proje. CTranslate2 ve CUDA kütüphaneleri
# birkaç gigabayt ve çekirdeğin kapılarının hiçbiri onlara bakmıyor. Çalıştırma:
#
#     uv run --project services/stt python services/stt/main.py <config.yaml>
[project]
name = "mayen-stt"
version = "0.1.0"
description = "Mayen'in STT servisi: Whisper, kendi sürecinde"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper==1.2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=14",  # uvicorn'un WebSocket ucu (/vad)
    "numpy>=2",
    "pyyaml>=6.0.3",
    "nvidia-cublas-cu12>=12.9",  # CTranslate2 CUDA 12 ister; sistemde olmayabilir
    "nvidia-cudnn-cu12>=9",
]

# Mayen'in TTS servisi; çekirdeğin ortamından ayrı bir proje. onnxruntime ve ses modelleri
# çekirdeğin kapılarının hiçbirine gerekmiyor. Çalıştırma:
#
#     uv run --project services/tts python services/tts/main.py <config.yaml>
[project]
name = "mayen-tts"
version = "0.1.0"
description = "Mayen'in TTS servisi: Kokoro ve Piper, kendi sürecinde"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "piper-tts==1.8.0",
    "phonemizer>=3.3",  # işaretli parçanın espeak okunuşu (Kokoro)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2",
    "scipy>=1.14",  # efekt süzgeçleri
    "soxr>=0.5",  # sesin hızı servisin sabit çıkış hızına
    "pyyaml>=6.0.3",
]
